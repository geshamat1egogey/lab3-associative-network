<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Эксперимент: Ассоциативная сеть</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        #experiment-container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 { font-size: 24px; color: #333; min-height: 60px; }
        .instructions { color: #666; margin-top: 20px; min-height: 30px; }
        .key {
            display: inline-block;
            background: #eee;
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-weight: bold;
        }
        .progress {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div id="experiment-container">
        <div class="progress" id="progress-box"></div>
        <h1 id="question-box">Загрузка вопросов...</h1>
        <div class="instructions" id="instructions-box">
            Ожидайте...
        </div>
        <a href="/results" style="display: inline-block; margin-top: 30px; padding: 10px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-size: 14px; font-weight: bold;">Посмотреть статистику</a>
    </div>

    <script>
        let userId = "";
        let questions = [];
        let currentQuestionIndex = 0;
        let startTime = 0;
        // Состояния: LOADING, WAITING_FOR_SPACE, WAITING_FOR_ANSWER, SAVING, FINISHED
        let state = "LOADING"; 

        const questionBox = document.getElementById('question-box');
        const instructionsBox = document.getElementById('instructions-box');
        const progressBox = document.getElementById('progress-box');

        // Вспомогательная функция: делает до 3 попыток отправки при сбое сети
        async function sendWithRetry(url, payload, retries = 3) {
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) {
                        return await response.json();
                    }
                } catch (err) {
                    console.warn(`Попытка отправки ${i + 1} не удалась...`);
                }
                await new Promise(resolve => setTimeout(resolve, 800));
            }
            throw new Error("Не удалось связаться с сервером");
        }

        // Шаг 1: Получаем вопросы с сервера
        fetch('/api/start_session')
            .then(response => response.json())
            .then(data => {
                userId = data.user_id;
                questions = data.questions;
                setWaitingForSpaceState();
            })
            .catch(() => {
                questionBox.innerText = "Ошибка загрузки вопросов";
                instructionsBox.innerText = "Обновите страницу (F5)";
            });

        // Режим отдыха между вопросами
        function setWaitingForSpaceState() {
            if (currentQuestionIndex >= questions.length) {
                state = "FINISHED";
                progressBox.innerText = "";
                questionBox.innerText = "Тестирование завершено. Все ответы успешно сохранены, спасибо!";
                instructionsBox.innerText = "Можете закрыть страницу или посмотреть статистику.";
                return;
            }
            state = "WAITING_FOR_SPACE";
            progressBox.innerText = `Вопрос ${currentQuestionIndex + 1} из ${questions.length}`;
            questionBox.innerText = "Готовы к следующему вопросу?";
            instructionsBox.innerHTML = "Нажмите <span class='key'>ПРОБЕЛ</span>, когда будете готовы";
        }

        // Показ вопроса
        function showNextQuestion() {
            state = "WAITING_FOR_ANSWER";
            let q = questions[currentQuestionIndex];
            questionBox.innerText = q.text;
            instructionsBox.innerHTML = "<span class='key'>← ВЛЕВО</span> (Да, верно) &nbsp;&nbsp;&nbsp; <span class='key'>ВПРАВО →</span> (Нет, неверно)";
            startTime = performance.now(); // Запускаем высокоточный таймер
        }

        // Обработчик клавиатуры
        document.addEventListener('keydown', async function(event) {
            if (state === "FINISHED" || state === "SAVING" || state === "LOADING") return;

            if (state === "WAITING_FOR_SPACE" && event.code === 'Space') {
                event.preventDefault(); // Чтобы страница не прокручивалась от пробела
                showNextQuestion();
            }
            else if (state === "WAITING_FOR_ANSWER") {
                if (event.code === 'ArrowLeft' || event.code === 'ArrowRight') {
                    // 1. Сразу фиксируем точное время реакции до работы сети
                    let endTime = performance.now();
                    let reactionTimeSec = (endTime - startTime) / 1000.0;
                    let userAnswer = (event.code === 'ArrowLeft') ? true : false;
                    let currentQ = questions[currentQuestionIndex];

                    // 2. Блокируем повторные нажатия на время сохранения
                    state = "SAVING";
                    questionBox.innerText = "Сохранение ответа...";
                    instructionsBox.innerText = "Подождите долю секунды...";

                    const payload = {
                        user_id: userId,
                        question_id: currentQ.id,
                        concept_1: currentQ.concept_1,
                        concept_2: currentQ.concept_2,
                        is_correct_logic: currentQ.is_correct,
                        answer: userAnswer,
                        reaction_time: reactionTimeSec
                    };

                    try {
                        // 3. Ждем гарантированной записи на сервере
                        await sendWithRetry('/api/save_log', payload, 3);
                        currentQuestionIndex++;
                        setWaitingForSpaceState();
                    } catch (error) {
                        alert("⚠️ Ошибка соединения с сервером! Проверьте интернет и ответьте на этот вопрос ещё раз. Ваш прогресс сохранен.");
                        showNextQuestion(); // Возвращаем этот же вопрос и сбрасываем таймер
                    }
                }
            }
        });
    </script>
</body>
</html>
